upstream ride_prd {
    server localhost:3000;
}

upstream ops_portal {
    server localhost:3002;
}

upstream vendor_portal {
    server localhost:3001;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M;

    # Ops Portal - all paths
    location ~ ^/ops {
        proxy_pass http://ops_portal;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:3002;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_redirect http://localhost:3002 http://localhost/ops;
    }

    # Vendor Portal - all paths
    location ~ ^/vendor {
        proxy_pass http://vendor_portal;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:3001;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_redirect http://localhost:3001 http://localhost/vendor;
    }

    # Everything else to ride_prd
    location / {
        proxy_pass http://ride_prd;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
}
