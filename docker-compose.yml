version: '3.8'

services:
  nginx:
    image: nginx:latest
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ride-prd
      - ride-ops
      - ride-vendor
    networks:
      - ride-network

  ride-prd:
    build:
      context: ./ride_prd
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
    networks:
      - ride-network
    expose:
      - "3000"

  ride-ops:
    build:
      context: ./ride-ops-portal
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
    networks:
      - ride-network
    expose:
      - "3000"

  ride-vendor:
    build:
      context: ./ride-vendor-portal
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
    networks:
      - ride-network
    expose:
      - "3000"

networks:
  ride-network:
    driver: bridge
