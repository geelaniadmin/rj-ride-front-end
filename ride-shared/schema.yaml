      summary: Returns a presigned URL for PDF download
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Presigned download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_DownloadUrl"

  /v1/billing/payouts:
    get:
      operationId: listPayouts
