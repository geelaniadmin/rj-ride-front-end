openapi: "3.1.0"
info:
  title: RIDE API
  version: "1.0.0"
  description: Rezolv Integrated Dispatch Engine — Backend API

servers:
  - url: /api
    description: Proxied backend

tags:
  - name: auth
  - name: config
  - name: trips
  - name: fleet
  - name: pricing
  - name: billing
  - name: dispatch
  - name: tracking
  - name: safety

paths:
  /v1/auth/csrf:
    get:
      operationId: getCsrfToken
      tags: [auth]
      summary: Obtain CSRF token (sets csrftoken cookie)
      responses:
        "204":
          description: Cookie set

  /v1/auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Return authenticated user session
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_AuthUser"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Email + password login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_AuthUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Invalidate session
      responses:
        "204":
          description: Logged out

  /v1/auth/ws-ticket:
    post:
      operationId: getWsTicket
      tags: [auth]
      summary: Obtain a short-lived WebSocket auth ticket
      responses:
        "200":
          description: WS ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_WsTicket"

  /v1/config/vendors:
    get:
      operationId: listVendors
      tags: [config]
      summary: List vendors
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: page_size
          in: query
          schema: { type: integer }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Vendor cursor page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_VendorPage"
    post:
      operationId: createVendor
      tags: [config]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorInput"
      responses:
        "201":
          description: Created vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Vendor"

  /v1/config/vendors/{id}:
    patch:
      operationId: updateVendor
      tags: [config]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorInput"
      responses:
        "200":
          description: Updated vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Vendor"
    delete:
      operationId: deactivateVendor
      tags: [config]
      summary: Soft-delete (deactivate) a vendor
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deactivated vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Vendor"

  /v1/config/customers:
    get:
      operationId: listCustomers
      tags: [config]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: page_size
          in: query
          schema: { type: integer }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Customer cursor page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_CustomerPage"
    post:
      operationId: createCustomer
      tags: [config]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Customer"

  /v1/config/customers/{id}:
    patch:
      operationId: updateCustomer
      tags: [config]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Customer"
    delete:
      operationId: deactivateCustomer
      tags: [config]
      summary: Soft-delete (deactivate) a customer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deactivated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Customer"

  /v1/config/vehicle-types:
    get:
      operationId: listVehicleTypes
      tags: [config]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: page_size
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: VehicleType cursor page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_VehicleTypePage"
    post:
      operationId: createVehicleType
      tags: [config]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleTypeInput"
      responses:
        "201":
          description: Created vehicle type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_VehicleType"

  /v1/config/vehicle-types/{id}:
    patch:
      operationId: updateVehicleType
      tags: [config]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleTypeInput"
      responses:
        "200":
          description: Updated vehicle type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_VehicleType"
    delete:
      operationId: deactivateVehicleType
      tags: [config]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deactivated vehicle type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_VehicleType"

  /v1/config/pricing/rate-cards:
    get:
      operationId: listConfigRateCards
      tags: [config]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: page_size
          in: query
          schema: { type: integer }
        - name: vendor_id
          in: query
          schema: { type: string }
        - name: customer_id
          in: query
          schema: { type: string }
        - name: vehicle_type_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: RateCard cursor page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_ConfigRateCardPage"
    post:
      operationId: createConfigRateCard
      tags: [config]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigRateCardInput"
      responses:
        "201":
          description: Created rate card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_ConfigRateCard"

  /v1/config/pricing/rate-cards/{id}/supersede:
    post:
      operationId: supersedeRateCard
      tags: [config]
      summary: Create a new version superseding an existing rate card
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigRateCardInput"
      responses:
        "201":
          description: New version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_ConfigRateCard"

  /v1/config/pricing/simulate:
    post:
      operationId: simulateQuote
      tags: [config]
      summary: Simulate a quote using the pricing engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateInput"
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_SimulateResult"

  /v1/trips:
    get:
      operationId: listTrips
      tags: [trips]
      summary: List trip requests (cursor-paginated)
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: customerId
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
        - name: cursor
          in: query
          schema: { type: string }
        - name: page_size
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Trip cursor page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_TripPage"
    post:
      operationId: createTrip
      tags: [trips]
      summary: Book a trip (send priceIds locked from quote)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripCreateInput"
      responses:
        "201":
          description: Created trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Trip"

  /v1/trips/{id}:
    get:
      operationId: getTrip
      tags: [trips]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Trip detail with vehicles and timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Trip"
    patch:
      operationId: updateTrip
      tags: [trips]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Trip"

  /v1/trips/{id}/check-cancel:
    post:
      operationId: checkCancelTrip
      tags: [trips]
      summary: Preview cancellation penalty before confirming
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cancellation preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_CancelPreview"

  /v1/trips/{id}/cancel:
    post:
      operationId: cancelTrip
      tags: [trips]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Trip"

  /v1/trips/{id}/clone:
    post:
      operationId: cloneTrip
      tags: [trips]
      summary: Clone a trip with optional overrides
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                scheduleWhen:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Cloned trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Trip"

  /v1/trips/{id}/vehicles/{vehicleId}/transitions:
    post:
      operationId: transitionVehicle
      tags: [trips]
      summary: Advance vehicle state machine — 409 if transition not allowed
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: vehicleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionInput"
      responses:
        "200":
          description: Vehicle updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_TripVehicle"
        "409":
          description: Transition not allowed by state machine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/trips/{id}/vehicles/{vehicleId}/verify-otp:
    post:
      operationId: verifyOtp
      tags: [trips]
      summary: Verify OTP for pickup or drop
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: vehicleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyInput"
      responses:
        "200":
          description: OTP verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_TripVehicle"
        "422":
          description: Wrong OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/trips/{id}/vehicles/{vehicleId}/assign:
    post:
      operationId: assignVehicleDriver
      tags: [trips]
      summary: Assign a fleet vehicle and driver to a trip vehicle slot
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: vehicleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignInput"
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_TripVehicle"

  /v1/trips/{id}/adjustments:
    post:
      operationId: createTripAdjustment
      tags: [trips]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMinor, currency, reason]
              properties:
                amountMinor:
                  type: integer
                  description: Signed minor units (negative = credit)
                currency:
                  type: string
                reason:
                  type: string
      responses:
        "201":
          description: Adjustment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Adjustment"

  /v1/trips/bulk-validate:
    post:
      operationId: bulkValidateTrips
      tags: [trips]
      summary: Phase-1 of bulk upload — per-row verdict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkValidateInput"
      responses:
        "200":
          description: Per-row validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_BulkValidateResult"

  /v1/trips/bulk-commit:
    post:
      operationId: bulkCommitTrips
      tags: [trips]
      summary: Phase-2 of bulk upload — commit valid rows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkCommitInput"
      responses:
        "201":
          description: Committed trips
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_BulkCommitResult"

  /v1/trips/recurring-rules:
    get:
      operationId: listRecurringRules
      tags: [trips]
      summary: List recurring trip rules
      responses:
        "200":
          description: Rules list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_RecurringRuleList"
    post:
      operationId: createRecurringRule
      tags: [trips]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringRuleInput"
      responses:
        "201":
          description: Created rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_RecurringRule"

  /v1/trips/recurring-rules/{id}:
    patch:
      operationId: updateRecurringRule
      tags: [trips]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringRuleInput"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_RecurringRule"
    delete:
      operationId: deleteRecurringRule
      tags: [trips]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /v1/pricing/quote:
    post:
      operationId: getQuote
      tags: [pricing]
      summary: Get priced offers for a set of vehicle type slots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteInput"
      responses:
        "200":
          description: Offers with priceId + expiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_QuoteResult"

  /v1/fleet/vehicles:
    get:
      operationId: listVehicles
      tags: [fleet]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: page_size
          in: query
          schema: { type: integer }
        - name: available
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Vehicle list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_VehicleList"

  /v1/fleet/vehicles/{id}:
    get:
      operationId: getVehicle
      tags: [fleet]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Vehicle detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Vehicle"

  /v1/fleet/drivers:
    get:
      operationId: listDrivers
      tags: [fleet]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: page_size
          in: query
          schema: { type: integer }
        - name: available
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Driver list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_DriverList"

  /v1/fleet/drivers/{id}:
    get:
      operationId: getDriver
      tags: [fleet]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Driver detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Driver"

  /v1/pricing/rate-cards:
    get:
      operationId: listRateCards
      tags: [pricing]
      responses:
        "200":
          description: Rate card list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_RateCardList"

  /v1/pricing/rate-cards/{id}:
    get:
      operationId: getRateCard
      tags: [pricing]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Rate card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_RateCard"

  /v1/dispatch/board:
    get:
      operationId: getDispatchBoard
      tags: [dispatch]
      summary: Kanban board grouped by vehicle status columns
      responses:
        "200":
          description: Board columns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_DispatchBoard"

  /v1/dispatch/auto-assign:
    post:
      operationId: autoAssignAll
      tags: [dispatch]
      summary: Auto-assign all PENDING vehicles
      responses:
        "200":
          description: Assignment summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_AutoAssignResult"

  /v1/dispatch/assignments:
    get:
      operationId: listAssignments
      tags: [dispatch]
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_AssignmentList"

  /v1/tracking/live:
    get:
      operationId: getLivePositions
      tags: [tracking]
      summary: Current positions of all active tracked vehicles
      responses:
        "200":
          description: Live positions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_LivePositionList"

  /v1/tracking/{tripVehicleId}/track:
    get:
      operationId: trackTripVehicle
      tags: [tracking]
      summary: Path, milestones and ETA for a specific vehicle
      parameters:
        - name: tripVehicleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Track detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_TrackDetail"

  /v1/billing/invoices:
    get:
      operationId: listInvoices
      tags: [billing]
      summary: List billable invoices
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: customerId
          in: query
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: page_size
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Invoice cursor page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_InvoicePage"

  /v1/billing/invoices/{id}:
    get:
      operationId: getInvoice
      tags: [billing]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invoice with lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Invoice"

  /v1/billing/invoices/{id}/void:
    post:
      operationId: voidInvoice
      tags: [billing]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Voided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Invoice"

  /v1/billing/invoices/{id}/adjust:
    post:
      operationId: adjustInvoice
      tags: [billing]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMinor, currency, reason]
              properties:
                amountMinor:
                  type: integer
                  description: Signed minor units
                currency:
                  type: string
                reason:
                  type: string
      responses:
        "201":
          description: Adjustment applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_Invoice"

  /v1/billing/statements:
    get:
      operationId: listStatements
      tags: [billing]
      parameters:
        - name: customerId
          in: query
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: page_size
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Statement list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope_StatementPage"

  /v1/billing/statements/{id}/download:
    get:
      operationId: downloadStatement
