          type: string
          nullable: true
          readOnly: true
        vehicle_id:
          type: string
          format: uuid
          nullable: true
        vendor_id:
          type: string
          format: uuid
          nullable: true
        lat:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        lng:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        recorded_at:
          type: string
          format: date-time
          nullable: true
        raised_by_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        acked_by_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        acked_at:
          type: string
          format: date-time
          nullable: true
        resolved_by_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        resolution_note:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - acked_by_id
      - created_at
      - id
      - kind
      - raised_by_id
      - reference
      - resolved_by_id
      - severity
      - trip_id
      - trip_vehicle_id
      - vehicle_id
      - vendor_id
    SafetyAlertKindEnum:
