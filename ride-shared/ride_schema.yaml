    SafetyAlert:
      type: object
      description: |-
        Board/detail shape. Driver identity is intentionally not exposed here — the control-room
        board is about the trip, and driver PII masking is the trips/partner surface's job.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          $ref: '#/components/schemas/SafetyAlertKindEnum'
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        status:
          $ref: '#/components/schemas/SafetyAlertStatusEnum'
        trip_vehicle_id:
          type: string
          format: uuid
          readOnly: true
