          type: string
          format: date-time
          readOnly: true
        sent_at:
          type: string
          format: date-time
          nullable: true
      required:
      - channel
      - created_at
      - id
      - recipient_masked
      - template_key
    DeliveryStatusEnum:
      enum:
      - QUEUED
      - SENT
      - FAILED
      type: string
      description: |-
        * `QUEUED` - Queued
        * `SENT` - Sent
        * `FAILED` - Failed
    DocTypeEnum:
      enum:
      - REGISTRATION
      - PERMIT_NATIONAL
      - PERMIT_STATE
      - FITNESS
      - PUC
      - INSURANCE
      - LICENCE
      - PSV_BADGE
      - POLICE_VERIFICATION
      - MEDICAL
      - INDUCTION
      type: string
      description: |-
        * `REGISTRATION` - Registration certificate
        * `PERMIT_NATIONAL` - National permit
        * `PERMIT_STATE` - State permit
        * `FITNESS` - Fitness certificate
