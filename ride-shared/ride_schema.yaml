          type: boolean
          readOnly: true
        pickup_otp:
          type: string
          readOnly: true
        drop_otp:
          type: string
          readOnly: true
        pax:
          readOnly: true
          description: 'Passenger list: [{name, phone, email?}].'
        penalty_minor:
          type: integer
          readOnly: true
          description: Cancellation penalty in minor units. Set by cancel_vehicle().
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - currency
      - driver
      - driver_name
      - drop_otp
      - drop_verified
      - id
      - locked_price
      - locked_rate_card_version
      - pax
      - penalty_minor
      - pickup_otp
      - pickup_verified
      - requested_vehicle_type
      - status
      - vehicle
      - vehicle_plate
      - vehicle_type_name
      - vendor
      - vendor_name
    Vehicle:
