          allOf:
          - $ref: '#/components/schemas/DocTypeEnum'
          readOnly: true
        number:
          type: string
          readOnly: true
        expiry_date:
          type: string
          format: date
          readOnly: true
        file_key:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedDriver:
      type: object
      description: |-
        Masks PII fields unless the viewer is entitled to the raw value.

        The matrix (§11), stated as one rule: you see raw contact details for yourself, and a
        VENDOR_MANAGER additionally sees them for their own vendor's people. Everyone else —
        including AGENCY_ADMIN — sees masked values.

        That AGENCY_ADMIN is masked is deliberate and worth not "fixing": an operator dispatches
        trips, which needs a name and a role, not a driver's personal phone number. The masking
        is server-side, so no client flag or query param can turn it off.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        vendor:
          type: string
          format: uuid
          readOnly: true
        vendor_name:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        licence_number:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/DriverStatusEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        user:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedNotificationTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        key:
          type: string
          maxLength: 100
        channel:
          $ref: '#/components/schemas/ChannelEnum'
        locale:
          type: string
          maxLength: 10
        body:
          type: string
          description: Message body with {placeholder} fields.
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
