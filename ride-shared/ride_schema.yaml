    StatementLine:
      type: object
      properties:
        reference:
          type: string
          maxLength: 64
        amount_minor:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        operator_fee_minor:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        net_minor:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        currency:
          type: string
          maxLength: 3
      required:
      - amount_minor
      - currency
      - reference
    StatementStatusEnum:
      enum:
      - DRAFT
      - FINAL
      type: string
      description: |-
        * `DRAFT` - Draft
        * `FINAL` - Final
    Status3c2Enum:
      enum:
      - UNBILLED
      - STATEMENTED
      - RECONCILED
      type: string
      description: |-
        * `UNBILLED` - Unbilled
        * `STATEMENTED` - Statemented
        * `RECONCILED` - Reconciled
    StatusBaeEnum:
      enum:
      - PENDING
      - VENDOR_OFFERED
      - ASSIGNED
      - DRIVER_ACCEPTED
      - EN_ROUTE_PICKUP
      - AT_PICKUP
      - PAX_PICKED
      - IN_TRANSIT
      - AT_DROP
      - PAX_DROPPED
      - COMPLETED
      - NO_SHOW
      - BREAKDOWN
      - ACCIDENT
      - VEHICLE_SWAP
      - DELAYED
      - SOS
      - CANCELLED
      type: string
      description: |-
        * `PENDING` - Pending
        * `VENDOR_OFFERED` - Offered to vendor
        * `ASSIGNED` - Assigned
        * `DRIVER_ACCEPTED` - Driver accepted
        * `EN_ROUTE_PICKUP` - En route to pickup
        * `AT_PICKUP` - At pickup
        * `PAX_PICKED` - Passenger picked up
        * `IN_TRANSIT` - In transit
        * `AT_DROP` - At drop
        * `PAX_DROPPED` - Passenger dropped
        * `COMPLETED` - Completed
        * `NO_SHOW` - No show
        * `BREAKDOWN` - Breakdown
        * `ACCIDENT` - Accident
        * `VEHICLE_SWAP` - Vehicle swap
        * `DELAYED` - Delayed
        * `SOS` - SOS
        * `CANCELLED` - Cancelled
    Stop:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sequence:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/StopKindEnum'
          readOnly: true
        address:
          type: string
          readOnly: true
        lat:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
          nullable: true
        lng:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
          nullable: true
        location_type:
          allOf:
          - $ref: '#/components/schemas/LocationTypeEnum'
          readOnly: true
        extra:
          readOnly: true
          description: 'Optional payload: flight_number for AIRPORT, train_number
            for RAIL.'
      required:
      - address
      - extra
      - id
      - kind
      - lat
      - lng
      - location_type
      - sequence
    StopKindEnum:
      enum:
      - PICKUP
      - DROP
      - WAYPOINT
      type: string
      description: |-
        * `PICKUP` - Pickup
        * `DROP` - Drop
        * `WAYPOINT` - Waypoint
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TripRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        reference:
          type: string
          readOnly: true
          description: Human-readable reference T-{seq}, unique per tenant. Never
            edit after creation.
        customer:
          type: string
          format: uuid
          readOnly: true
        customer_name:
          type: string
          readOnly: true
        pickup_at:
          type: string
          format: date-time
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/TripRequestStatusEnum'
          readOnly: true
        created_via:
          allOf:
          - $ref: '#/components/schemas/CreatedViaEnum'
          readOnly: true
        coordinator:
          readOnly: true
          description: 'Coordinator contact details snapshot: name, phone, email.'
        cost_center:
          type: string
          readOnly: true
        stops:
          type: array
          items:
            $ref: '#/components/schemas/Stop'
          readOnly: true
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/TripVehicle'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - coordinator
      - cost_center
      - created_at
      - created_via
      - customer
      - customer_name
      - id
      - pickup_at
      - reference
      - status
      - stops
      - vehicles
    TripRequestStatusEnum:
      enum:
      - DRAFT
      - CONFIRMED
      - ASSIGNED
      - IN_PROGRESS
      - COMPLETED
      - BILLED
      - CANCELLED
      type: string
      description: |-
        * `DRAFT` - Draft
        * `CONFIRMED` - Confirmed
        * `ASSIGNED` - Assigned
        * `IN_PROGRESS` - In progress
        * `COMPLETED` - Completed
        * `BILLED` - Billed
        * `CANCELLED` - Cancelled
    TripVehicle:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        requested_vehicle_type:
          type: string
          format: uuid
          readOnly: true
        vehicle_type_name:
          type: string
          readOnly: true
        vendor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        vendor_name:
          type: string
          readOnly: true
          nullable: true
        vehicle:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        vehicle_plate:
          type: string
          readOnly: true
          nullable: true
        driver:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        driver_name:
          type: string
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusBaeEnum'
          readOnly: true
        locked_price:
          type: integer
          readOnly: true
          nullable: true
