      operationId: metrics_retrieve
      description: |-
        Prometheus scrape endpoint (commit 16, §14).

        Unauthenticated by design: it exposes only aggregate counters (no PII, no per-tenant data),
        and is meant to be bound to an internal port/path allowlisted at the ALB, never routed to the
        public internet (see docs §14 for the ALB split). Returns 404 when METRICS_ENABLED is off.

        Under gunicorn (PROMETHEUS_MULTIPROC_DIR set) it aggregates every worker's samples via
        MultiProcessCollector; single-process (runserver/worker) serves the default registry.
      tags:
      - metrics
      responses:
        '200':
          description: No response body
  /partner/v1/auth/refresh:
    post:
      operationId: partner_v1_auth_refresh_create
      description: |-
        POST /partner/v1/auth/refresh — rotate the pair.

        SimpleJWT's own view: it validates the refresh token, blacklists it (ROTATE +
        BLACKLIST_AFTER_ROTATION), and issues a new pair. The partner claims ride along in the
        token payload, so the new access token carries the same identity with no DB read.

        TokenRefreshView is already AllowAny and authenticates via the refresh token in the
        body, so no authentication_classes / permission_classes overrides are needed.
      tags:
      - partner
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /partner/v1/auth/token:
    post:
      operationId: partner_v1_auth_token_create
      description: |-
        POST /partner/v1/auth/token — exchange an API key for a JWT pair.

        Unauthenticated (there is no token yet). The lookup is prefix-then-constant-time-hash:
        the prefix finds at most one active row, and compare_digest decides it, so a wrong key
        and an unknown key cost the same and reveal the same (nothing).
      tags:
      - partner
      security:
      - {}
      responses:
        '200':
          description: No response body
  /partner/v1/book:
    post:
      operationId: partner_v1_book_create
      description: |-
        POST /partner/v1/book — Idempotency-Key required (§10).

        Idempotency is enforced by the middleware via this flag, exactly like the portal booking
        endpoint. A replayed key returns the original response, so a partner retrying a timed-out
        booking never double-books.
      tags:
      - partner
      responses:
        '200':
          description: No response body
  /partner/v1/check-time:
    get:
      operationId: partner_v1_check_time_retrieve
      description: GET /partner/v1/check-time?price_id&pickup_at — pure pre-flight,
        no side effects.
      tags:
      - partner
      responses:
        '200':
          description: No response body
  /partner/v1/quote:
    post:
      operationId: partner_v1_quote_create
      description: POST /partner/v1/quote — offers for the credential's customer.
      tags:
      - partner
      responses:
        '200':
          description: No response body
  /partner/v1/trips/{reference}:
    get:
      operationId: partner_v1_trips_retrieve
      description: GET /partner/v1/trips/{reference} — status, vehicles (driver masked),
        stops.
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - partner
      responses:
        '200':
          description: No response body
  /partner/v1/trips/{reference}/cancel:
    post:
      operationId: partner_v1_trips_cancel_create
      description: POST /partner/v1/trips/{reference}/cancel — Idempotency-Key required.
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - partner
      responses:
        '200':
          description: No response body
  /partner/v1/trips/{reference}/confirm:
    post:
      operationId: partner_v1_trips_confirm_create
      description: |-
        POST /partner/v1/trips/{reference}/confirm — idempotent no-op (§10 contract compat).

        Booking already confirms in RIDE (there is no two-phase commit), so confirm is a
        read that returns current state. Kept because partner integrations expect the verb.
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - partner
      responses:
        '200':
          description: No response body
  /partner/v1/trips/{reference}/vouchers:
    get:
      operationId: partner_v1_trips_vouchers_retrieve
      description: GET /partner/v1/trips/{reference}/vouchers — presigned download
        URLs per vehicle voucher.
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - partner
      responses:
        '200':
          description: No response body
  /partner/v1/webhooks:
    get:
      operationId: partner_v1_webhooks_retrieve
      tags:
      - partner
      responses:
        '200':
          description: No response body
    post:
      operationId: partner_v1_webhooks_create
      tags:
      - partner
      responses:
        '200':
          description: No response body
  /partner/v1/webhooks/{subscription_id}:
    get:
      operationId: partner_v1_webhooks_retrieve_2
      parameters:
      - in: path
        name: subscription_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - partner
      responses:
        '200':
          description: No response body
    patch:
      operationId: partner_v1_webhooks_partial_update
      parameters:
      - in: path
        name: subscription_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - partner
      responses:
        '200':
          description: No response body
    delete:
      operationId: partner_v1_webhooks_destroy
      parameters:
      - in: path
        name: subscription_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - partner
      responses:
        '204':
          description: No response body
  /partner/v1/webhooks/{subscription_id}/deliveries:
    get:
      operationId: partner_v1_webhooks_deliveries_retrieve
      parameters:
      - in: path
        name: subscription_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - partner
      responses:
        '200':
          description: No response body
  /readyz:
    get:
      operationId: readyz_retrieve
      tags:
      - readyz
      responses:
        '200':
          description: No response body
components:
  schemas:
    Adjustment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        amount_minor:
          type: integer
          readOnly: true
          description: Signed integer minor units. Positive = surcharge; negative
            = credit.
        reason:
          type: string
          readOnly: true
        actor:
          type: string
          format: uuid
          readOnly: true
        actor_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - actor_name
      - amount_minor
      - created_at
      - id
      - reason
    BasisEnum:
      enum:
      - PER_KM
      - FIXED_LOCATION_PAIR
      - HOURLY
      - PACKAGE
      type: string
      description: |-
        * `PER_KM` - Per kilometre
        * `FIXED_LOCATION_PAIR` - Fixed price for a location pair
        * `HOURLY` - Per hour
        * `PACKAGE` - Package with included km/hours
    BillableTrip:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        trip:
          type: string
          format: uuid
          readOnly: true
        trip_reference:
          type: string
          readOnly: true
        subtotal_minor:
          type: integer
          readOnly: true
        operator_fee_minor:
          type: integer
          readOnly: true
        total_minor:
          type: integer
          readOnly: true
        fee_config_snapshot:
          readOnly: true
          description: Snapshot of tenant.operator_fee_config at billing time.
        lines:
          type: array
          items:
            $ref: '#/components/schemas/BillingLine'
          readOnly: true
        adjustments:
          type: array
          items:
            $ref: '#/components/schemas/Adjustment'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - adjustments
      - created_at
      - fee_config_snapshot
      - id
      - lines
      - operator_fee_minor
      - subtotal_minor
      - total_minor
      - trip
      - trip_reference
    BillingLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        trip_vehicle:
          type: string
          format: uuid
          readOnly: true
        amount_minor:
          type: integer
          readOnly: true
          description: Integer minor units. locked_price for completed; penalty_minor
            for cancelled.
        currency:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/Status3c2Enum'
          readOnly: true
        voided:
          type: boolean
          readOnly: true
        void_reason:
          type: string
          readOnly: true
        voided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount_minor
      - created_at
      - currency
      - id
      - status
      - trip_vehicle
      - void_reason
      - voided
      - voided_at
    BoardCard:
      type: object
      description: One card on the kanban board.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        trip:
          type: string
          format: uuid
          readOnly: true
        trip_reference:
          type: string
          readOnly: true
        pickup_at:
          type: string
          format: date-time
          readOnly: true
        pickup_address:
          type: string
          readOnly: true
        vehicle_type:
          type: string
          readOnly: true
        vendor_name:
          type: string
          readOnly: true
        vehicle_registration:
          type: string
          readOnly: true
        driver_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusBaeEnum'
          readOnly: true
        column:
          type: string
          description: Map granular status to board column name.
          readOnly: true
        locked_price:
          type: integer
          readOnly: true
          nullable: true
          description: Integer minor units. Set once at booking; DB trigger rejects
            changes.
        currency:
          type: string
          readOnly: true
      required:
      - column
      - currency
      - driver_name
      - id
      - locked_price
      - pickup_address
      - pickup_at
      - status
      - trip
      - trip_reference
      - vehicle_registration
      - vehicle_type
      - vendor_name
    ChannelEnum:
      enum:
      - MATTERMOST
      - WHATSAPP
      - SMS
      - IN_APP
      type: string
      description: |-
        * `MATTERMOST` - Mattermost
        * `WHATSAPP` - WhatsApp
        * `SMS` - SMS
        * `IN_APP` - In-app
    CreatedViaEnum:
      enum:
      - MANUAL
      - CLONE
      - BULK
      - RECURRING
      - API_PAX
      - API_VEHICLE_COUNT
      type: string
      description: |-
        * `MANUAL` - Manual
        * `CLONE` - Cloned from another trip
        * `BULK` - Bulk upload
        * `RECURRING` - Recurring rule
        * `API_PAX` - API — pax payload
        * `API_VEHICLE_COUNT` - API — vehicle count
    Credential:
      type: object
      description: Read serializer. The key hash is never exposed — only the prefix.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        customer:
          type: string
          format: uuid
          readOnly: true
        customer_name:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
          description: Human label, e.g. 'RISMA production'.
        key_prefix:
          type: string
          readOnly: true
        is_sandbox:
          type: boolean
          readOnly: true
        throttle_rate:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - customer
      - customer_name
      - id
      - is_active
      - is_sandbox
      - key_prefix
      - last_used_at
      - name
      - throttle_rate
    Customer:
      type: object
      description: |-
        Vendor/Customer contact details.

        A vendor's own record counts as "self" for its managers — they may see their own
        company's contact details in full; an agency admin sees them masked, like any other PII.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        contact_name:
          type: string
          readOnly: true
        contact_phone:
          type: string
          readOnly: true
        contact_email:
          type: string
          format: email
          readOnly: true
        address:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - contact_email
      - contact_name
      - contact_phone
      - created_at
      - id
      - name
    Delivery:
      type: object
      description: 'Redacted: recipient_masked only, no raw destination (there is
        none stored).'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        channel:
          $ref: '#/components/schemas/ChannelEnum'
        recipient_masked:
          type: string
