openapi: 3.0.3
info:
  title: RIDE API
  version: 1.0.0
  description: Rezolv Integrated Dispatch Engine — multi-tenant B2B transport dispatch.
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: |-
        GET /api/v1/auth/csrf/ — set the CSRF cookie so SPAs can read it before login POST.

        The browser must call this once before any state-mutating request when the SPA is
        on a different origin from the server and cannot rely on an existing cookie. Returns
        204 with no body; the side effect is the Set-Cookie header (CSRF_COOKIE_HTTPONLY=False
        so JS can read the value).
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: POST /api/v1/auth/login/ — email + password, optional tenant_slug.
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        POST /api/v1/auth/logout/. POST, not GET: a GET logout is CSRF-triggerable from an
        <img> tag, and DRF exempts GET from CSRF checks.
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: |-
        GET /api/v1/auth/me/ — the caller's own record, always with raw PII (it is theirs).

        Returns {id, name, email, role, vendor_id, tenant: {id, name, currency}} plus
        is_active and created_at.
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/ws-ticket/:
    post:
      operationId: auth_ws_ticket_create
      description: |-
        POST /api/v1/auth/ws-ticket/ — issue a single-use 30-second WS upgrade ticket.

        The SPA calls this (session-authenticated) right before opening the WebSocket.  The
        returned token is passed as ?ticket=<token> on the WS upgrade URL.  The Channels
        auth middleware consumes it via Redis GETDEL — single-use, TTL-bounded.
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WsTicketResponse'
          description: ''
  /api/v1/billing/billable-trips/:
    get:
      operationId: billing_billable_trips_list
      description: 'Billable trips: list, detail, void line, add adjustment. AGENCY_ADMIN
        only.'
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - billing
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBillableTripList'
          description: ''
  /api/v1/billing/billable-trips/{id}/:
    get:
      operationId: billing_billable_trips_retrieve
      description: 'Billable trips: list, detail, void line, add adjustment. AGENCY_ADMIN
        only.'
      parameters:
