              $ref: '#/components/schemas/RateCard'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RateCard'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RateCard'
      security:
      - cookieAuth: []
      responses:
