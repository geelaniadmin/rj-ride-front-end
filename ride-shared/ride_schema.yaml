      type: object
      description: |-
        Vendor/Customer contact details.

        A vendor's own record counts as "self" for its managers — they may see their own
        company's contact details in full; an agency admin sees them masked, like any other PII.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        contact_name:
          type: string
          readOnly: true
